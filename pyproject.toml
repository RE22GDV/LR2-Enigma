[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lr2-enigma"
version = "1.0.0"
description = "Лабораторна робота №2: шифр Енігми (CodinGame) та його криптоаналіз"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.8", "numpy>=1.26"]

[project.scripts]
enigma = "enigma.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
